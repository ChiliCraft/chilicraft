  gui-main-fragments-name: "<gold>灵魂碎片"
  gui-main-fragments-lore: "<gray>点击导航到最近一片碎片</gray>"
  gui-main-death-name: "<gold>最近死亡"
  gui-main-death-lore-none: "<gray>暂无死亡记录</gray>"
  gui-main-death-lore-cause: "<gray>死因：<cause></gray>"
  gui-main-death-lore-time: "<gray>时间：<time></gray>"
