  gui-main-funeral-lore-rate: "<gray>召回率：基础 <pct>%（篝火 / 月亮井 / 死亡点可加成）</gray>"
  gui-main-funeral-lore-relic: "<gray>手持沉眠遗物可送别入土</gray>"
  gui-main-funeral-lore-active: "<gold>仪式进行中，站定等待……</gold>"
  gui-main-funeral-lore-none: "<yellow>点击开始仪式</yellow>"
  # 遗物图鉴面板：说明牌 / 效果行 / 状态行
  gui-title-relics: "<dark_gray>遗物图鉴"
  gui-relics-info-name: "<gold>图鉴说明"
  gui-relics-info-lore: "<gray>在场 <count> / 共 <total> 件</gray>"
  gui-relics-effect: "<gray>效果：<effect> · 数值 <value> · 灵韵上限 <durability></gray>"
  gui-relics-state-active: "<aqua>在场 · 灵韵 <durability>/<max></aqua>"
