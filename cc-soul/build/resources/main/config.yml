# ============================================================
#  ChiliCraft 灵魂附属配置（cc-soul）
#
#  * 全部数值可调；/cc reload 后即时生效
#  * 文本均为 MiniMessage 格式
#  * 死亡灵魂损失化为「灵魂碎片」（纯记录，无实体）：
#    走近自动拾回，或通过葬礼仪式按加成召回
# ============================================================

# ---------- 夜间判定（原版时间刻）：与 cc-survival / cc-demon 保持一致 ----------
night-start: 13042
night-end: 23458

# ---------- 死亡结算 ----------
death:
  # 死亡时随机保留物品百分比（其余正常掉落；遗物默认整组保护，见 protect-relics）
  item-keep-pct: 50
  # 死亡时灵魂损失百分比，化为死亡点「灵魂碎片」（碎片拾回 / 葬礼召回均为全额载体）
  soul-loss-pct: 50
  # 遗物死亡不掉落（全服唯一物品保护，随 50% 保留物品一并回到重生点）
  protect-relics: true
  # 死亡播报（附临终遗言）
  broadcast: true
  # 临终遗言有效期（分钟）：距死亡多久内的发言算「临终」
  last-words-max-age-minutes: 5

# ---------- 灵魂碎片 ----------
fragment:
  # 碎片过期时间（小时）：过期后自动删除（不可拾回）
  expire-hours: 24
  # 自动拾回半径（格）：走近即全额拾回（引魂灯遗物可扩大此半径）
  pickup-radius: 4.0

# ---------- 葬礼仪式 ----------
funeral:
  # 仪式费用（灵魂）：开始时扣除，中断不退还
  cost: 10000
  # 站桩时长（秒）：期间离开仪式点即中断
  duration-seconds: 60
  # 站桩判定半径（格）：超出即中断
  stand-radius: 1.5
  # 召回基础比例（%）：召回量 = 死亡点碎片总额 ×（基础 + 各项地点加成）
  recovery-base-pct: 50
  # 篝火加成：仪式点附近有燃烧的篝火 / 灵魂篝火
  bonfire:
    radius: 5
    bonus-pct: 10
    materials: [CAMPFIRE, SOUL_CAMPFIRE]
    require-lit: true
  # 月亮井加成：仪式点附近有盛水的炼药锅
  moonwell:
    radius: 5
    bonus-pct: 25
    materials: [CAULDRON]
    require-water: true
  # 死亡点加成：在死亡点附近举行仪式（并立墓碑）
  death-point:
    radius: 8
    bonus-pct: 50
  # 召回碎片吸收半径（格）：召回死亡点周围多少格内的碎片
  absorb-radius: 16
  # 墓碑：享受死亡点加成时在死亡点立碑（仅放置于空气方块）
  tombstone:
    enabled: true
    material: CHISELED_STONE_BRICKS
  # 供品（巡演「混入人类计划」联动）：仪式开始时手持旧眼镜上供，站桩时长按倍率缩短
  offerings:
    old-glasses:
      enabled: true
      material: SPYGLASS
      # 上供后的站桩时长倍率（0.5 = 缩短一半，区间 0.1-1.0）
      duration-multiplier: 0.5

# ---------- 遗物 ----------
relics:
  # 灵韵（耐久）默认上限；每条定义可单独覆盖
  default-durability: 100
  # 灵韵批量落库间隔（秒）：触发式消耗不打库，状态迁移（沉眠/入土）即时落库
  db-flush-interval: 60
  # 12 遗物定义（全服唯一，每 ID 同时至多一份在场）
  # effect 取值：rain_resist / fragment_radius / hunger_keep / night_regen /
  #   water_breath / fall_resist / demon_ward / speed / night_vision /
  #   generic_resist / drink_heal / kill_soul
  # value 语义随 effect 而定（比例 / 格数 / 点数）
  definitions:
    umbrella:
      material: GRAY_DYE
      display: "<gray>五块钱的伞</gray>"
      lore: "<gray>雨天里，至少灵魂是干的。</gray>"
      effect: rain_resist
      value: 0.20
      durability: 100
    soul-lantern:
      material: SOUL_LANTERN
      display: "<yellow>引魂灯</yellow>"
      lore: "<gray>碎片循着灯光回到主人身边。</gray>"
      effect: fragment_radius
      value: 4.0
      durability: 100
    rice-bowl:
      material: BOWL
      display: "<white>深夜食堂的饭碗</white>"
      lore: "<gray>饱腹的灵魂不易被侵蚀。</gray>"
      effect: hunger_keep
      value: 0.20
      durability: 100
    moon-shard:
      material: PRISMARINE_SHARD
      display: "<aqua>月亮井的碎片</aqua>"
      lore: "<gray>月光下，伤口缓慢愈合。</gray>"
      effect: night_regen
      value: 1.0
      durability: 100
    water-veil:
      material: HEART_OF_THE_SEA
      display: "<blue>水做的纱衣</blue>"
      lore: "<gray>呼吸像潮水一样自然。</gray>"
      effect: water_breath
      value: 1.0
      durability: 100
    dream-feather:
      material: FEATHER
      display: "<white>半梦的羽毛</white>"
      lore: "<gray>坠落也不过是半场梦。</gray>"
      effect: fall_resist
      value: 0.50
      durability: 100
    cat-bell:
      material: BELL
      display: "<gold>小猫的铃铛</gold>"
      lore: "<gray>饿魔厌恶的清脆声响。</gray>"
      effect: demon_ward
      value: 0.25
      durability: 100
    earth-map:
      material: COMPASS
      display: "<green>地球的第一张地图</green>"
      lore: "<gray>走得再远，也带着方向。</gray>"
      effect: speed
      value: 0.10
      durability: 100
    star-jar:
      material: EXPERIENCE_BOTTLE
      display: "<light_purple>群星的罐子</light_purple>"
      lore: "<gray>夜空被装进了瓶子里。</gray>"
      effect: night_vision
      value: 1.0
      durability: 100
    iron-heart:
      material: CHAIN
      display: "<gray>混入人类的铁心</gray>"
      lore: "<gray>疼痛减轻了一分。</gray>"
      effect: generic_resist
      value: 0.10
      durability: 100
    tea-cup:
      material: GLASS_BOTTLE
      display: "<white>食堂的旧茶杯</white>"
      lore: "<gray>热茶下肚，命也回来一点。</gray>"
      effect: drink_heal
      value: 0.20
      durability: 100
    shadow-thread:
      material: STRING
      display: "<dark_gray>不安的灵魂之线</dark_gray>"
      lore: "<gray>每一次收割都缠上一缕。</gray>"
      effect: kill_soul
      value: 0.10
      durability: 100

# ---------- 消息模板（MiniMessage） ----------
messages:
  # 遗物通用尾行：灵韵 / 持有者 / 流转史
  relic-lore: "<dark_gray>灵韵 <aqua><durability></aqua><dark_gray>/<max> · 持有者 <white><owner></white></dark_gray>"
  relic-history: "<dark_gray>流转：<history></dark_gray>"
  relic-history-sep: "<dark_gray> → </dark_gray>"
  # 墓碑名（方块顶部悬停不可见，仅作标记）
  tombstone-name: "<dark_gray>在此长眠</dark_gray>"
  # ---------- /soul 箱子 GUI（平铺键：本模块消息为浅键加载，禁止嵌套小节） ----------
