# ChiliCraft 灵魂附属（cc-soul）
name: cc-soul
version: "${version}"
main: com.chilicraft.soul.ChiliSoulPlugin
api-version: "1.21"
authors: [ChiliCraft]
description: 灵魂与死亡：死亡结算 / 临终遗言 / 灵魂碎片 / 葬礼仪式 / 12 遗物 / 物品流转史

# 硬依赖核心：核心未启用时本附属自动禁用
# 软依赖 cc-demon：识别饿魔伤害（未安装时该加成静默降级）
depend: [cc-core]
# 兼容基线：兼容的核心 API 版本（核心装载时校验，未达标给出可读告警）
compatible-core: ">=1.0"
softdepend: [cc-demon]

commands:
  soul:
    description: 灵魂命令（灵魂菜单 / 碎片导航 / 死亡记录 / 遗物图鉴 / 葬礼）
    usage: /soul <menu|fragments|deaths|relics|funeral|relic|reload>
    permission: chilicraft.soul.use

permissions:
  chilicraft.soul.use:
    description: 允许使用灵魂模块
    default: true
  chilicraft.soul.user:
    description: 允许使用 /soul 玩家命令
    default: true
  chilicraft.soul.admin:
    description: 允许使用 /soul relic give 发放遗物与管理操作
    default: op
