# ============================================================
# cc-martial 配置（数值与开关）
# 流派 / 技能 / 词缀等「内容定义」在 skills.yml（数据驱动，可整包替换）
# ============================================================

# ---------- 境界（6 层：凡人 0 → 破天下 5） ----------
realms:
  # 各境界显示名（索引 0-5 对应凡人/拙劲/素青纱/铜钱挂/绣花蹄/破天下）
  display:
    - "凡人"
    - "拙劲"
    - "素青纱"
    - "铜钱挂"
    - "绣花蹄"
    - "破天下"
  unlock:
    # 拙劲(1)：累计击杀生物数
    kill-threshold: 50
    # 素青纱(2)：通关地城次数（订阅 adventure.dungeon_clear）
    dungeon-clears: 1
    # 铜钱挂(3)：击杀 Boss 次数（订阅 adventure.boss_killed）
    boss-kills: 1
    # 绣花蹄(4)：完成擂台次数（martial.arena_win）
    arena-wins: 1
    # 破天下(5)：击败下列 id 之一的世界 Boss（订阅 adventure.boss_killed，
    # target 命中即达成；cc-adventure 未实装时事件不会到达，条件自然悬置）
    world-boss-ids:
      - "nightmare"
  # 每境界可装备的主动技能槽数（索引=境界）
  skill-slots: [2, 3, 4, 4, 5, 5]
  # 每境界叠加加成（索引=境界，百分比为 0-100）
  bonuses:
    # 近战伤害加成（%）
    melee-damage-pct: [0, 5, 10, 15, 20, 30]
    # 受击减伤（%）
    damage-reduction-pct: [0, 0, 3, 6, 10, 15]
    # 额外最大生命（半心=1）
    max-health-bonus: [0, 0, 0, 2, 4, 6]

# ---------- 每日擂台 ----------
arena:
  enabled: true
  # 每日开擂时刻（服务器本地时间），报名窗口 = 开擂前 signup-minutes 分钟
  times: ["20:00", "22:00"]
  signup-minutes: 15
  # 擂台区域（自定义区域检查，不依赖 WorldGuard）
  world: "world"
  center-x: 0
  center-z: 0
  radius: 16
  # 冠军奖励
  champion-souls: 5000
  # Vault 金钱加成（联动未启用或为 0 时跳过）
  champion-money: 0.0
  # 巡演联动：败者安慰礼（「下等马」），每场败者获赠灵魂，0=关闭
  loser-consolation-souls: 100
  # 巡演联动：夺冠「演」演出（冠军标题 + 全服音效）
  champion-show: true
  # 擂台内允许施展武学技能（装备仍统一铁套铁剑）
  allow-skills: true
  # 统一装备（arena.kit 段：材质名；armor 依次=头/胸/腿/脚）
  kit:
    armor: [IRON_HELMET, IRON_CHESTPLATE, IRON_LEGGINGS, IRON_BOOTS]
    weapon: IRON_SWORD

# ---------- 技能通用 ----------
skills:
  # 武学手册材质：右键施展当前选中技能，潜行+右键切换已装备技能
  handbook-material: BOOK
  # 全局公共冷却（秒），叠加在各技能独立冷却之上
  global-cooldown: 1.0
  # 武学经验来源（分配给全部已习得技能，独立升级）
  xp-kill: 2
  xp-boss: 10
  xp-dungeon: 25
  # 技能升级所需经验表（索引=等级-1；最大等级 = 表长度）
  passive-xp-curve: [10, 25, 50, 90, 140]

# ---------- 词缀 ----------
affixes:
  # 击杀掉落武器/工具时随机施加词缀概率（%，0=关闭）
  drop-roll-chance: 5.0
  # 每件物品最多词缀数
  max-per-item: 1

# ---------- 外部联动（插件在场且此处开启才生效，缺失自动降级） ----------
integration:
  # MythicMobs：流派武品发放与技能特效托管（skills.yml 内 mythic-* 键）
  mythicmobs: true
  # PlaceholderAPI：%chilimartial_* 变量
  placeholders: true
  # Vault：擂台冠军金钱加成
  vault: true

