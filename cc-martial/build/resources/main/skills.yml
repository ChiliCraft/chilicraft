# ---------- 词缀（45 条，事件钩子结算） ----------
# 通用键：display(改名附加) / tier(1-3: 绿/蓝/金) / hook(ATTACK|DAMAGED|HUNGER|WATER|KILL|PASSIVE) / params
# params 约定：
#   chance            触发概率%（缺省 100 = 必发；作用于该条词缀全部效果）
#   bonus-damage      固定附加伤害（ATTACK）
#   burn-seconds      点燃秒数（ATTACK）
#   heal              自回血量（ATTACK 吸血 / DAMAGED 止血 / PASSIVE 周期回血 / KILL 击杀回血）
#   self-hunger       自耗饱食（ATTACK，先扣 saturation 不足扣 1 food）
#   reduce-pct        减伤百分比（DAMAGED）
#   thorns            反伤固定值（DAMAGED，对攻击者）
#   save-chance       取消概率%（HUNGER 饱食降低减免 / WATER 氧气消耗减免）
#   heal-on-eat       进食回血（HUNGER）
#   max-air-bonus     最大氧气加成（WATER，卸下后回落原版 300）
#   food              回饱食点数（KILL）
#   absorption/every  黄心量 / 间隔心跳（PASSIVE）
#   potion            药水效果（ATTACK 施于目标 / DAMAGED 反施攻击者 / KILL 自身 / PASSIVE 常驻），
#                     配 amplifier(等级, 缺省 0) + duration-seconds(秒, 缺省 3；PASSIVE 常驻无此键)
#   1.21.1 药水键名：slowness / weakness / poison / strength / resistance / speed / night_vision
# 扫描槽位：ATTACK/KILL 查主手；DAMAGED/HUNGER/WATER/PASSIVE 查主手+四盔甲
