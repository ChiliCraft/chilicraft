# ============================================================
# cc-adventure · 地城定义（10 个，5 种机制 × 2）
# 修改后由 /cc reload 热载（DungeonContent 整体重建注册表）
#
# 机制说明：
#   GUARD_CAULDRON 守锅：波次刷怪，怪物贴锅扣耐久，清光全波=通关，锅碎=失败
#   SACRIFICE      献祭：手持名单物品右键祭坛，达到目标数=通关
#   BEAR_WEIGHT    承重：桥面逐排塌陷，任一队员踩到终点金块=通关，坠落回入口
#   UNDERWATER     水下：房间灌水，波次刷怪（发放水下呼吸），清光全波=通关
#   DUAL_REALM     双界：两名队员分别右键界门甲/乙，双门齐亮=通关
#
# template 为空 = 程序生成封闭房间；填写后优先放置
# plugins/cc-adventure/structures/<template>.nbt（缺失自动回退程序生成）。
# ============================================================

dungeons:

