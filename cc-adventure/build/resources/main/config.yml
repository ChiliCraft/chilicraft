# ============================================================
# cc-adventure · 冒险线配置
# 地城副本（每队独立实例）/ 远征（5 层随机房间）/ 世界 Boss
# 修改后由 /cc reload 热载（订阅 core.reload 整体重建本缓存）
# ============================================================

# ---------- 组队 ----------
party:
  # 单支队伍人数上限（地城与远征共用同一支队伍）
  max-size: 4

# ---------- 地城 ----------
dungeon:
  enabled: true
  # 独立地城世界（空世界，实例按槽位隔离，互不串场）
  world-name: world_cc_dungeon
  # 最大并发实例数（也是区域槽位数；满员时进入排队）
  instance-slots: 8
  # 槽位 x 方向间隔（格），必须大于最大地城 size.x
  slot-stride: 256
  # 实例区域基准高度
  base-y: 64
  # 区域清理每 tick 方块预算（分帧防卡主线程）
  wipe-budget-per-tick: 4000
  # 排队重试间隔（秒）
  queue-retry-seconds: 5
  # 地城默认时限（dungeons.yml 未填 time-limit-seconds 时兜底）
  time-limit-seconds: 600

# ---------- 远征 ----------
expedition:
  enabled: true
  # 独立远征世界（航道按 x 方向大间隔隔离）
  world-name: world_cc_expedition
  # 层数（规格：5 层制，末层固定 Boss 房）
  layers: 5
  # 最大并发远征队数
  max-runs: 4
  # 每层通关灵魂（逐队员）
  soul-per-layer: 5
  # 全程通关追加灵魂（逐队员）
  clear-bonus: 25
  # 连续 N 次祝福后强制 1 次诅咒（规格：2:1 节律）
  force-curse-after-blessings: 2
  # 祝福/诅咒药水效果时长（tick；默认 600 秒覆盖一层）
  effect-duration-ticks: 12000
  # 前 4 层房间权重（末层恒为 Boss 房，不参与随机）
  room-weights:
    combat: 30     # 战斗房
    elite: 15      # 精英房
    chest: 10      # 宝箱房
    trap: 10       # 陷阱房
    rest: 10       # 休整房
    shop: 10       # 商店房
    event: 8       # 奇遇房
    puzzle: 7      # 机关房
  # 祝福池：类型:强度:名称（类型为药水效果名，强度 0=I 级）
  blessings:
    - "speed:1:让风告诉你"
    - "strength:1:拙劲"
    - "regeneration:1:糖水"
    - "resistance:1:硬糖外壳"
    - "water_breathing:0:水做的悲伤"
    - "night_vision:0:夜巡"
    - "jump_boost:1:飞鸟说"
    - "haste:1:厚嘴唇星人的馈赠"
  # 诅咒池：同上格式
  curses:
    - "slowness:1:滞留半梦界"
    - "weakness:1:混入失败"
    - "poison:0:过期辣酱"
    - "blindness:0:迷航"
    - "hunger:1:饿魔注视"
    - "mining_fatigue:1:手腕打结"

# ---------- 世界 Boss ----------
boss:
  enabled: true
  # 环境触发条件巡检间隔（秒；雨天深海/雷暴/随机/深层按此节拍抽查）
  check-seconds: 15
  # Boss 技能事件间隔（秒）
  skill-seconds: 6
  # Boss 存活超时（分钟；0=不超时）。超时强制清除，避免 Boss 永久占位
  despawn-minutes: 30

# ---------- 集成 ----------
integration:
  # MythicMobs 在场且为 true 时，Boss 生成与技能交 MM 托管（bosses.yml 的 mythic-id）；
  # MM 缺失或生成失败自动降级原版实体路径，无需改配置
  mythicmobs: false

