# ============================================================
#  ChiliCraft 夜晚饿魔配置（cc-demon）
#
#  * 全部数值可调；/cc reload（或 /demon reload）后即时生效
#  * 刷怪强度额外乘以核心模式参数 MOB_SPAWN_RATE
#    （adventure = 1.0；cozy = 0.3，刷怪大幅减少）
#  * 文本均为 MiniMessage 格式
# ============================================================

# ---------- 夜间判定（原版时间刻）：与 cc-survival 保持一致 ----------
night-start: 13042
night-end: 23458

# ---------- 刷怪 ----------
spawn:
  enabled: true
  # 生成判定间隔（秒）：夜间每玩家周期判定一次
  interval: 30
  # 生成点与玩家的距离范围（格）：太近会当面刷出，太远追不上
  radius-min: 24
  radius-max: 48
  # 每玩家周围允许的饿魔数量上限（含该玩家触发生成的一切类型）
  max-per-player: 12
  # 全服饿魔数量上限（性能红线：硬上限，防止刷怪失控）
  global-limit: 80
  # 巡演联动：排除世界名单（方街安全区）——名单内世界不刷饿魔，饿魔也不索敌；
  # cc-street 发布 street.world_enter 时主类会额外清除入街玩家周围的存量饿魔
  excluded-worlds: [world_street]
  # 小饿魔：成群生成数量
  imp:
    group-min: 3
    group-max: 6
  # 本次判定附带生成猎手的概率（0-1）
  hunter-chance: 0.35
  # 本次判定附带生成母体的概率（0-1）
  mother-chance: 0.05

# ---------- 饿意追踪 ----------
hunger:
  enabled: true
  # 饱食度低于此值触发饿意追踪（规格值 6）
  threshold: 6
  # 追踪半径（格，规格值 48）
  radius: 48
  # 追击移速加成（规格值 0.30 = +30%）
  speed-boost: 0.30

# ---------- 母体 ----------
mother:
  # 召唤间隔（秒，规格值 10）
  summon-interval: 10
  # 每次召唤小饿魔数量范围
  summon-min: 1
  summon-max: 2
  # 每只母体存活召唤物上限（小饿魔计数）
  max-summons: 8

# ---------- 白天清除 ----------
daytime:
  # 白天周期清除全部饿魔（防止残留到日出）
  clear: true

# ---------- 掉落 ----------
drops:
  # 饿魔之牙：稳定掉落（兑换材料）
  fang:
    material: SLIME_BALL
    min: 1
    max: 2
  # 饱腹之魂：概率掉落（右键恢复 100% 饱食度）
  soul:
    material: GHAST_TEAR
    chance: 0.15

# ---------- 属性（原版生物改属性 + 改名，不重写 AI） ----------
attributes:
  imp:
    health: 12.0    # 规格值 12
    damage: 4.0     # 规格值 4
  hunter:
    health: 24.0    # 规格值 24
    damage: 7.0     # 规格值 7
  mother:
    health: 200.0   # 规格值 200
    damage: 12.0    # 规格值 12

# ---------- MythicMobs 接管（可选，规格 v1.1） ----------
# 安装 MythicMobs 且开关开启时，下方配置了 MM 内部 ID 的饿魔类型改由 MM 生成：
# 技能、行为与展示名全部按 MM 侧 mob 配置执行（建议仍用原版生物模型）；
# 未配置 ID 的类型、MM 缺失或生成失败时，一律回退上方「属性改造」路径。
# 无论走哪条路径，击杀掉落 / demon.mob_killed 事件 / 白天清除 / 安全区联动行为不变。
integration:
  mythicmobs: false
mythic:
  types:
    # imp: hungry_imp          # MM 内部 ID；注释掉即该类型不走 MM
    # hunter: hungry_hunter
    # mother: hungry_mother

