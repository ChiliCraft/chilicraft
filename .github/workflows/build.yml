name: CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: Build (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 各模块以 compileOnly(files("../test-server/plugins/...")) 引用若干第三方
      # 软依赖，这些 jar 不入库。CI 先按构建脚本期望的文件名补齐，否则编译期缺类。
      - name: 补齐软依赖 jar（test-server/plugins）
        run: |
          set -euo pipefail
          mkdir -p test-server/plugins
          curl -fsSL -o "test-server/plugins/[占位符]PlaceholderAPI-2.12.3.jar" \
            "https://repo.extendedclip.com/releases/me/clip/placeholderapi/2.12.3/placeholderapi-2.12.3.jar"
          curl -fsSL -o "test-server/plugins/[经济桥]Vault-1.7.3.jar" \
            "https://jitpack.io/com/github/MilkBowl/VaultAPI/1.7/VaultAPI-1.7.jar"
          curl -fsSL -o "test-server/plugins/[协议库]ProtocolLib.jar" \
            "https://repo.dmulloy2.net/repository/public/com/comphenix/protocol/ProtocolLib/5.3.0/ProtocolLib-5.3.0.jar"
          curl -fsSL -o "test-server/plugins/[神话生物]MythicMobs-5.13.0.jar" \
            "https://mvn.lumine.io/repository/maven-public/io/lumine/Mythic-Dist/5.13.0/Mythic-Dist-5.13.0.jar"

      # gradlew 在仓库中未设可执行位，统一用 sh 调用
      - name: 构建
        run: sh gradlew build --no-daemon

      # 先拷贝到扁平目录，再上传该目录，产物内即为裸 jar。
      - name: 收集构建产物到单一目录
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          find cc-*/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -exec cp {} dist/ \;
          ls -l dist

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: chilicraft-plugins
          path: dist/*.jar
          if-no-files-found: error
          retention-days: 14
